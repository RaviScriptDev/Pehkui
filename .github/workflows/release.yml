name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '25'

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Minecraft Version & Select Java
        id: setup_env
        run: |
          # Reads minecraft_version from gradle.properties
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "Detected Minecraft Version: $MC_VERSION"
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT

          # Determine Java version based on prefix (1.xx vs 2x.x)
          if [[ "$MC_VERSION" =~ ^1\. ]]; then
            echo "java_version=21" >> $GITHUB_OUTPUT
            echo "Java Version: 21 (Targeting 1.xx)"
          elif [[ "$MC_VERSION" =~ ^2 ]]; then
            echo "java_version=25" >> $GITHUB_OUTPUT
            echo "Java Version: 25 (Targeting 2x.x+)"
          else
            # Fallback default
            echo "java_version=21" >> $GITHUB_OUTPUT
            echo "Unknown version pattern, defaulting to Java 21"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.setup_env.outputs.java_version }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod Jar
        run: ./gradlew jar

      - name: Find Built Jar File
        id: find_jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep "Pehkui-" | head -n 1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found jar: $JAR_FILE"

      - name: Check if Pre-release
        id: prerelease_check
        run: |
          echo "Tag name: ${{ github.ref_name }}"
          if [[ "${{ github.ref_name }}" =~ [Aa][Ll][Pp][Hh][Aa] ]] || [[ "${{ github.ref_name }}" =~ [Bb][Ee][Tt][Aa] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Tag contains alpha/beta. Marking as pre-release."
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release tag detected."
          fi

      - name: Create GitHub Release & Upload Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_jar.outputs.jar_file }}
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

