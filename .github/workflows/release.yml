name: Build and Release

on:
    push:
        tags:
            - 'v*'

env:
    JAVA_VERSION: '25'

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4

            -   name: Read Minecraft Versions & Select Java
                id: setup_env
                run: |
                    # 1. Try to read metadata_minecraft_versions, fallback to minecraft_version if it doesn't exist
                    RAW_VERSIONS=$(grep '^metadata_minecraft_versions=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
                    if [ -z "$RAW_VERSIONS" ]; then
                      RAW_VERSIONS=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
                    fi
                    
                    echo "github.ref_name ${{ github.ref_name }}"
                    echo "Detected Versions Raw: $RAW_VERSIONS"
                    
                    # 2. Replace commas with newlines for multi-version support in GitHub Actions outputs
                    # We use a multiline delimiter EOF to pass it safely
                    formatted_versions=$(echo "$RAW_VERSIONS" | sed 's/,/\n/g')
                    
                    echo "minecraft_version=$RAW_VERSIONS" >> $GITHUB_OUTPUT
                    echo "game_versions<<EOF" >> $GITHUB_OUTPUT
                    echo "$formatted_versions" >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT
                    
                    # 3. Grab the first version to determine the Java version (21 vs 25)
                    FIRST_VERSION=$(echo "$RAW_VERSIONS" | cut -d',' -f1)
                    if [[ "$FIRST_VERSION" =~ ^1\. ]]; then
                      echo "java_version=21" >> $GITHUB_OUTPUT
                      echo "Java Version: 21 (Targeting 1.xx)"
                    elif [[ "$FIRST_VERSION" =~ ^2 ]]; then
                      echo "java_version=25" >> $GITHUB_OUTPUT
                      echo "Java Version: 25 (Targeting 2x.x+)"
                    else
                      echo "java_version=21" >> $GITHUB_OUTPUT
                      echo "Defaulting to Java 21"
                    fi
            -   name: Set up JDK
                uses: actions/setup-java@v6.1.0
                with:
                    distribution: 'temurin'
                    java-version: ${{ steps.setup_env.outputs.java_version }}

            -   name: Validate Gradle Wrapper
                uses: gradle/actions/setup-gradle@v3

            -   name: Build Mod Jar
                run: ./gradlew jar

            -   name: Find Built Jar File
                id: find_jar
                run: |
                    JAR_FILE=$(ls build/libs/*.jar | grep "Pehkui-" | head -n 1)
                    echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
                    echo "Found jar: $JAR_FILE"

            -   name: Check if Pre-release
                id: prerelease_check
                run: |
                    echo "Tag name: ${{ github.ref_name }}"
                    if [[ "${{ github.ref_name }}" =~ [Aa][Ll][Pp][Hh][Aa] ]] || [[ "${{ github.ref_name }}" =~ [Bb][Ee][Tt][Aa] ]]; then
                      echo "is_prerelease=true" >> $GITHUB_OUTPUT
                      echo "Tag contains alpha/beta. Marking as pre-release."
                    else
                      echo "is_prerelease=false" >> $GITHUB_OUTPUT
                      echo "Stable release tag detected."
                    fi

            -   name: Create GitHub Release & Upload Artifact
                uses: softprops/action-gh-release@v1
                with:
                    files: ${{ steps.find_jar.outputs.jar_file }}
                    prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
                    generate_release_notes: true
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Determine Release Channel
                id: channel_check
                run: |
                      TAG="${{ github.ref_name }}"
                      if [[ "$TAG" =~ [Aa][Ll][Pp][Hh][Aa] ]]; then
                        echo "channel=alpha" >> $GITHUB_OUTPUT
                        echo "Detected channel: alpha"
                      elif [[ "$TAG" =~ [Bb][Ee][Tt][Aa] ]]; then
                        echo "channel=beta" >> $GITHUB_OUTPUT
                        echo "Detected channel: beta"
                      else
                        echo "channel=release" >> $GITHUB_OUTPUT
                        echo "Detected channel: release"
                      fi
            -   uses: cloudnode-pro/modrinth-publish@v2.5.2
                with:
                    token: ${{ secrets.MODRINTH_TOKEN }}
                    project: fjGbh8Gv
                    version: ${{ github.ref_name }}
                    loaders: fabric
                    channel: ${{ steps.channel_check.outputs.channel }}
                    game-versions: '${{ steps.setup_env.outputs.game_versions }}'
                    files: ${{ steps.find_jar.outputs.jar_file }}
